name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/package-openai*', '.agents/plugins/marketplace.json', '.claude-plugin/marketplace.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/package-openai*', '.agents/plugins/marketplace.json', '.claude-plugin/marketplace.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --test ../scripts/package-openai.test.mjs
          npm test && npm run build
        working-directory: site
        env:
          SITE_URL: https://brainharness.si
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
